name: One-shot activate PriceReport KT Control production

on:
  push:
    branches:
      - "ops/activate-kt-control-production-20260925"

permissions:
  contents: read
  actions: write

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: e9d042a25886c61bf060ac0b94280e33868b1d42
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify main exact target
        shell: bash
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,target=process.env.TARGET_SHA,token=process.env.GH_TOKEN;
          const headers={authorization:`Bearer ${token}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'};
          const r=await fetch(`https://api.github.com/repos/${repo}/git/ref/heads/main`,{headers});
          if(!r.ok) throw new Error(`main ref HTTP ${r.status}`);
          const actual=(await r.json()).object.sha;
          if(actual!==target) throw new Error(`Main moved: ${actual} !== ${target}`);
          console.log(`MAIN_EXACT_TARGET_PASS ${actual}`);
          NODE

      - name: Dispatch canonical KT Control production workflow and wait
        shell: bash
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,target=process.env.TARGET_SHA,token=process.env.GH_TOKEN;
          const workflow='deploy-control-service.yml';
          const headers={authorization:`Bearer ${token}`,accept:'application/vnd.github+json','content-type':'application/json','x-github-api-version':'2022-11-28'};
          const started=Date.now()-15000;
          let r=await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/dispatches`,{method:'POST',headers,body:JSON.stringify({ref:'main',inputs:{confirm:'DEPLOY_KT_CONTROL'}})});
          if(!r.ok) throw new Error(`dispatch HTTP ${r.status}: ${await r.text()}`);
          console.log('KT_CONTROL_DISPATCH_ACCEPTED');
          const deadline=Date.now()+28*60*1000;
          while(Date.now()<deadline){
            r=await fetch(`https://api.github.com/repos/${repo}/actions/runs?branch=main&event=workflow_dispatch&per_page=30`,{headers});
            if(!r.ok) throw new Error(`runs HTTP ${r.status}`);
            const runs=(await r.json()).workflow_runs||[];
            const run=runs.find(x=>x.name==='Deploy PriceReport KT Control Service' && x.head_sha===target && Date.parse(x.created_at)>=started);
            if(run){
              console.log(`KT_CONTROL_RUN id=${run.id} status=${run.status} conclusion=${run.conclusion||''}`);
              if(run.status==='completed'){
                if(run.conclusion!=='success') throw new Error(`KT Control run ${run.id} => ${run.conclusion}`);
                process.exit(0);
              }
            }
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          throw new Error('KT Control production wait timeout');
          NODE
