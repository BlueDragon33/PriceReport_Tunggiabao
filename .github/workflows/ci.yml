name: Webapp CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "webapp/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - name: Syntax check
        run: node --check src/main.js
      - name: V5 UI guards
        run: node scripts/ui-v5.test.mjs
      - name: UI debt guards
        run: node scripts/ui-debt.test.mjs
      - name: Core business tests
        run: node scripts/core.test.mjs
      - name: Importer tests
        run: node scripts/importers.test.mjs
      - name: Exporter tests
        run: node scripts/exporters.test.mjs
      - name: PC storage tests
        run: node scripts/pc-storage.test.mjs
      - name: Logo processing tests
        run: node scripts/logo-processing.test.mjs
      - name: Device profile tests
        run: node scripts/device-profile.test.mjs
      - name: Production config tests
        run: node scripts/production-config.test.mjs
      - name: Service worker tests
        run: node scripts/service-worker.test.mjs
      - name: V5.4 customer import DOM regression
        run: npx vitest run tests/app.test.js -t "V5.4 customer library CSV import reviews and applies valid rows transactionally"
      - name: V5.4 product import DOM regression
        run: npx vitest run tests/app.test.js -t "V5.4 product import excludes duplicate groups and preserves currency variants"
      - name: V5.5 completion semantics regression
        run: npx vitest run tests/app.test.js -t "V5.5 completion state distinguishes unresolved warnings from reviewed data"
      - name: V5.5 keyboard safeguards regression
        run: npx vitest run tests/app.test.js -t "V5.5 keyboard-only import review starts in work and traps Tab inside the modal"
      - name: V5.5 Pass 6 safety boundary regression
        run: npx vitest run tests/app.test.js -t "V5.5 operator history|V5.5 expired import recovery"
      - name: V5.5 operator safety regression
        run: npx vitest run tests/app.test.js -t "V5.5"
      - name: Full app DOM regression tests
        run: npx vitest run tests/app.test.js
      - name: Migration DOM regression tests
        run: npx vitest run tests/migration.test.js
      - name: Smoke tests
        run: node scripts/smoke.mjs
      - run: npm run build
      - name: Install Chromium for V5.9 visual gate
        run: npx playwright install --with-deps chromium
      - name: V5.9 unified-shell browser gate
        run: node scripts/studio-v59-browser.test.mjs
