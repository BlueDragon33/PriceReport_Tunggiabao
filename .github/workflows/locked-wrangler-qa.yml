name: Audit pinned Wrangler lock regeneration
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/locked-wrangler-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regenerate-lock-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: control-service
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: Regenerate pinned lockfile without Git write privileges
        run: npm install --package-lock-only --save-dev --save-exact --ignore-scripts --no-audit --no-fund wrangler@4.151.1 @cloudflare/workers-types@5.20261016.1
      - name: Validate newly resolved package-lock by real install and Worker CI
        run: |
          npm ci --no-audit --no-fund
          npm run gate
      - name: Emit gzipped lockfile for audited readback
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import zlib from 'node:zlib'; import crypto from 'node:crypto'; const p=fs.readFileSync('package-lock.json'); console.log('LOCK_JSON_BYTES='+p.length); console.log('LOCK_SHA256='+crypto.createHash('sha256').update(p).digest('hex')); console.log('LOCKFILE_GZIP_BASE64_BEGIN'); console.log(zlib.gzipSync(p).toString('base64')); console.log('LOCKFILE_GZIP_BASE64_END');"
