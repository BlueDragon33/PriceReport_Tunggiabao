name: Universal Constitution Compliance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constitution:
    uses: BlueDragon33/Software-Blueprint-Hub/.github/workflows/constitution-compliance.yml@main

  dependency-sovereignty:
    name: Constitution 1.2 PriceReport dependency sovereignty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate project dependency budget
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path(".blueprint/constitution-adoption.json").read_text())
          b=json.loads(Path(".blueprint/dependency-budget.json").read_text())
          assert a["policyVersion"]=="1.2.0"
          assert "operational-sovereignty-dependency-minimization" in a["inheritedPillars"]
          assert b["policyVersion"]=="1.2.0"
          assert b["projectId"]==a["projectId"]=="project:pricereport-tunggiabao"
          assert b["posture"]=="LOCAL_BUSINESS_CORE_WITH_OPTIONAL_SYNC"
          assert b["complianceState"]=="MIGRATION_REQUIRED"
          deps={d["id"]:d for d in b["dependencies"]}
          assert deps["local-app-runtime"]["class"]=="LOCAL_CORE"
          assert deps["google-sheets"]["class"]=="OPTIONAL_SYNC"
          assert deps["google-apps-script"]["class"]=="OPTIONAL_SYNC"
          for d in b["dependencies"]:
              assert d.get("offlineBehavior")
              assert d.get("exitPath")
          forbidden=set(b["forbidden"])
          assert {"google-sheets-as-undocumented-transactional-authority","silent-last-write-wins-overwrite-without-version-conflict-policy","cloud-only-business-state-without-portable-export"} <= forbidden
          assert b["productionAuthority"]=="separate-explicit-release-gate"
          print("PriceReport Constitution 1.2 dependency sovereignty: PASS")
          PY
