name: PriceReport Control Service CI

on:
  push:
    branches: [main]
    paths:
      - "control-service/**"
      - "public/management-contract.json"
      - "src/device-access-gate.js"
      - ".github/workflows/control-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "control-service/**"
      - "public/management-contract.json"
      - "src/device-access-gate.js"
      - ".github/workflows/control-service-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: control-service/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck build and contract tests
        run: npm run gate
